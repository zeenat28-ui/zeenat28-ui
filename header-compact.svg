<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" role="img" aria-label="Zeenat Riaz, MLOps and AI Security Engineer">
<title>Zeenat Riaz | MLOps and AI Security Engineer</title>
<defs>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#08283D"/>
  <stop offset="0.5" stop-color="#0A3B4E"/>
  <stop offset="1" stop-color="#0C4E57"/>
</linearGradient>
<linearGradient id="waterText" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#BFEBFF"/>
  <stop offset="0.5" stop-color="#5FD3E0"/>
  <stop offset="1" stop-color="#3FC6A0"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-0.25 0; 0.25 0; -0.25 0" dur="14s" repeatCount="indefinite"/>
</linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
  <stop offset="0" stop-color="#7FE6F0" stop-opacity="0.22"/>
  <stop offset="1" stop-color="#7FE6F0" stop-opacity="0"/>
</radialGradient>
<clipPath id="nameClip">
